<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;overflow:hidden;font:14.5px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 520px at 88% -8%,#E6F6EA,transparent 62%),radial-gradient(800px 600px at -8% 108%,#A8DDB54d,transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}.mu,small{color:var(--mu)}
h1{font-size:25px;font-weight:700;letter-spacing:-.025em;margin:0 0 2px}h2{font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}h3{margin:0}.sub{color:var(--mu);margin:0 0 16px}
.ic{flex:none;display:block;transition:transform .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}@keyframes grow{from{width:0}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-26px) scale(1.08)}}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes rip{from{width:0;height:0;opacity:.55}to{width:520px;height:520px;opacity:0}}@keyframes slide{from{opacity:0;transform:translateX(-14px)}}@keyframes ping{0%{box-shadow:0 0 0 0 #39B54A80}100%{box-shadow:0 0 0 8px #39B54A00}}

.still *{animation:none!important}
/* logo */
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.02em;padding:2px 8px 12px}.logo.w{color:#fff;padding:0}

/* premium buttons */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:11px 22px;font-weight:650;letter-spacing:.01em;white-space:nowrap;color:#fff;text-shadow:0 1px 0 #0f2d1b55;
background:linear-gradient(180deg,var(--moss) 0%,var(--pine) 45%,var(--forest) 100%);box-shadow:inset 0 1px 0 #ffffff5c,inset 0 -2px 0 #00000020,0 1px 2px #0f2d1b55,0 12px 22px -10px #006838cc;transition:transform .25s var(--ease),box-shadow .3s,filter .2s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 32%,#ffffff55 50%,transparent 68%);transform:translateX(-130%);transition:transform .75s var(--ease)}
.btn::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:0;height:0;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:-1}.btn.rp::after{animation:rip .6s ease-out}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #ffffff66,inset 0 -2px 0 #00000020,0 1px 2px #0f2d1b55,0 18px 28px -10px #006838e6}.btn:hover::before{transform:translateX(130%)}
.btn:active{transform:translateY(0) scale(.97);filter:brightness(.96)}.btn:disabled{opacity:.55;cursor:default;transform:none;filter:saturate(.6)}.btn:focus-visible,.ib:focus-visible,.nav:focus-visible{outline:3px solid #39B54A99;outline-offset:2px}
.btn.t{color:var(--teal);text-shadow:none;background:linear-gradient(180deg,#fff,var(--mint));box-shadow:inset 0 0 0 1.5px var(--sage),0 1px 2px #0f2d1b14,0 8px 16px -10px #006838aa}.btn.t:hover{box-shadow:inset 0 0 0 1.5px var(--leaf),0 12px 20px -10px #006838aa}.btn.t::before{background:linear-gradient(115deg,transparent 32%,#A8DDB588 50%,transparent 68%)}
.btn.a,.btn.big{background:linear-gradient(180deg,var(--leaf) -40%,var(--moss) 30%,var(--forest) 100%);box-shadow:inset 0 1px 0 #ffffff6e,inset 0 -2px 0 #00000022,0 1px 2px #0f2d1b55,0 12px 22px -10px #006838dd;text-shadow:0 1px 0 #0f2d1b66}
.btn.d{color:var(--red);text-shadow:none;background:linear-gradient(180deg,#fff,#fdeeea);box-shadow:inset 0 0 0 1.5px #f1c7bd,0 8px 16px -12px #c0492b}.btn.d:hover{box-shadow:inset 0 0 0 1.5px var(--red),0 12px 20px -12px #c0492b}
.btn.s{padding:7px 14px;font-size:13px;border-radius:11px}.btn.big{width:100%;padding:13px;font-size:15px;margin-bottom:10px;border-radius:16px}
.btn.gb{width:100%;padding:12px;color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff,#f7fbf7);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 2px #0f2d1b14,0 10px 20px -14px #0f2d1b88}.btn.gb:hover{box-shadow:inset 0 0 0 1.5px var(--sage),0 14px 24px -14px #0f2d1baa}.btn.gb.ld{pointer-events:none;opacity:.7}
.ib{width:36px;height:36px;border-radius:12px;border:0;background:none;color:var(--mu);display:grid;place-items:center;transition:.2s var(--ease)}.ib:hover{background:var(--mint);color:var(--teal);transform:translateY(-1px)}.ib:disabled{opacity:.35;pointer-events:none}.ib.dd:hover{background:#fdeeea;color:var(--red)}.star.on{color:var(--amber)}.star.on svg path:first-child{fill-opacity:.9}
.nav:hover .ic,.btn:hover .ic,.ib:hover .ic,.mi:hover .ic{transform:translateY(-1px) scale(1.14) rotate(-5deg)}
/* inputs */
input,select{width:100%;padding:11px 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;outline:0;transition:.2s}input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 4px #39B54A40}input:disabled{background:var(--mint);cursor:not-allowed}

.chip{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--mint);color:var(--forest)}.chip.g{background:var(--mint);color:var(--forest);display:inline-flex;align-items:center;gap:6px}.chip.g::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:ping 1.6s infinite}.chip.r{background:#fdeeea;color:var(--red)}.chip.n{background:#f1f5f1;color:var(--mu)}
/* app shell */
.app{display:grid;grid-template-columns:262px 1fr;height:100vh;height:100dvh}

.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:6px 10px;border:0;border-radius:14px;background:none;font-weight:560;color:#35523f;text-align:left;transition:.2s var(--ease)}
.app:not(.still) .nav{animation:slide .5s var(--ease) both;animation-delay:calc(var(--n,0)*35ms)}
.nav:hover{background:#ffffff99;transform:translateX(3px)}.nav.on{background:#fff;box-shadow:var(--sh);color:var(--ink);font-weight:700}.nav.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.nav .t{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c);transition:.25s}.nav.on .t{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));color:#fff;box-shadow:0 6px 14px -4px color-mix(in srgb,var(--c) 70%,transparent)}
.sc{background:linear-gradient(160deg,#fff,#f5fbf5);border:1px solid var(--line);border-radius:18px;padding:13px;margin-top:8px;box-shadow:var(--sh)}.sr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}.sr span{color:var(--mu)}
.bar{height:8px;border-radius:9px;background:#e3efe4;overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--lime),var(--leaf),var(--forest));animation:grow 1.1s var(--ease)}.sc .btn{width:100%}
.content{display:flex;flex-direction:column;min-width:0;padding:0 14px 14px 0;height:100vh;height:100dvh}.top{display:flex;align-items:center;gap:12px;padding:14px 4px 12px}
.sb{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid transparent;box-shadow:var(--sh);border-radius:999px;padding:0 18px;width:min(520px,100%);color:var(--mu);transition:.2s}.sb:focus-within{border-color:var(--green);color:var(--teal);box-shadow:0 0 0 4px #39B54A40}.sb input{border:0;box-shadow:none!important;padding:11px 0;background:none}
.prof{position:relative}.av{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--moss),var(--forest));color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;box-shadow:inset 0 1px 0 #fff6,0 6px 16px -4px #006838aa;transition:.25s var(--ease)}.av:hover{transform:scale(1.08) rotate(-4deg)}.av.lg{width:64px;height:64px;font-size:26px;cursor:default}.av.lg:hover{transform:none}
.pm{position:absolute;right:0;top:50px;width:280px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -10px #0f2d1b40;padding:8px;z-index:20;animation:pop .2s var(--ease)}
.ph{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 10px 12px;text-align:center}.ph b{margin-top:6px}.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;border-radius:12px;font-weight:560;text-align:left;transition:.15s}.mi:hover{background:var(--mint)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:#ffffffe6;backdrop-filter:blur(10px);border-radius:26px;border:1px solid #ffffffcc;overflow:auto;padding:26px 32px;box-shadow:0 1px 2px #0f2d1b0a,0 24px 60px -24px #0f2d1b40;scrollbar-width:thin}
.panel:not(.still)>*{animation:rise .55s var(--ease) both}.panel:not(.still)>*:nth-child(2){animation-delay:.06s}.panel:not(.still)>*:nth-child(3){animation-delay:.12s}.panel:not(.still)>*:nth-child(4){animation-delay:.18s}
.panel.c{justify-content:center}.panel.cv{align-items:center;text-align:center}.panel.cv .card{text-align:left;width:100%}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stats{display:flex;gap:10px;flex-wrap:wrap}.st{display:flex;gap:10px;align-items:center;padding:7px 14px 7px 10px;border-radius:15px;background:color-mix(in srgb,var(--c) 9%,#fff);border:1px solid color-mix(in srgb,var(--c) 20%,#fff)}.st>svg{color:var(--c)}.st b{display:block;font-size:18px;line-height:1.1}.st span{font-size:12px;color:var(--mu)}
.rows{flex:1;min-height:0;display:flex;flex-direction:column}
.rowf{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;transition:.2s var(--ease)}.panel:not(.still) .rowf{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 120ms)}.rowf:hover{background:#f1f9f2;transform:translateX(3px)}.n{flex:1;min-width:0}.n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:620}.acts{display:flex;gap:2px;opacity:.55;transition:.2s}.rowf:hover .acts{opacity:1}
.ft{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 10%,#fff),color-mix(in srgb,var(--c) 22%,#fff));color:var(--c);font-size:10px;font-weight:800;letter-spacing:.03em}
.empty{margin:auto;text-align:center;color:var(--mu);padding:20px 10px}.empty svg{margin:0 auto 12px;color:var(--sage)}.empty h3{color:var(--ink);margin-bottom:4px}.empty .btn{margin-top:14px}
.empty>svg{animation:float 5s ease-in-out infinite}
.drop{border:2px dashed #A8DDB5;border-radius:18px;padding:12px 18px;margin:12px 0 8px;display:flex;align-items:center;gap:14px;color:var(--mu);cursor:pointer;transition:.25s var(--ease);background:#f7fcf7}.drop:hover{border-color:var(--green);background:var(--mint);transform:translateY(-2px)}.drop .ft{width:40px;height:40px}
.pgr{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--mu);font-size:13px}
.modal{position:fixed;inset:0;background:#0f2d1b66;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .2s}.dlg{background:#fff;border-radius:26px;padding:26px;width:100%;max-width:460px;box-shadow:0 30px 80px -10px #0f2d1b66;animation:pop .3s var(--ease)}.dlg.wide{max-width:640px}.end{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.cp{display:inline-flex;gap:6px;align-items:center;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:560;transition:.2s var(--ease)}.cp:hover:not(:disabled){transform:translateY(-1px);border-color:var(--sage)}.cp.on{border-color:var(--green);background:var(--mint);color:var(--teal)}.cp:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff;box-shadow:var(--sh);transition:.3s var(--ease)}.card:hover{transform:translateY(-2px)}.card.k{display:flex;gap:16px;align-items:center}
.seg{display:flex;height:14px;border-radius:9px;overflow:hidden;background:#e3efe4;margin:14px 0;gap:2px}.seg i{animation:grow 1s var(--ease)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:stretch;margin-top:8px}.pc{position:relative;border:1.5px solid var(--line);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;background:#fff;transition:.3s var(--ease)}.pc:hover{transform:translateY(-4px);box-shadow:0 24px 40px -22px color-mix(in srgb,var(--c) 70%,transparent)}.pc.pop{border-color:var(--c);box-shadow:0 18px 44px -20px color-mix(in srgb,var(--c) 60%,transparent)}.pc.cur{background:color-mix(in srgb,var(--c) 6%,#fff)}
.rib{position:absolute;top:-12px;left:22px;background:linear-gradient(180deg,var(--moss),var(--forest));color:#fff;font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:99px;box-shadow:0 6px 12px -4px #006838aa}.pc h3{font-size:19px;color:var(--c)}.fit{min-height:40px;margin:4px 0 6px;font-size:13.5px}.price{font-size:34px;font-weight:760;letter-spacing:-.03em}.price small{font-size:14px;font-weight:500}
.pc .btn{margin:10px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}.pc .btn.t{background:linear-gradient(180deg,#fff,var(--mint))}.pc ul{list-style:none;padding:0;margin:2px 0 0;display:grid;gap:6px;font-size:13.5px}.pc li{display:flex;gap:9px;align-items:center}.pc li svg{color:var(--c)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse}th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border:0}th{background:var(--mint);font-size:13px}td:first-child{font-weight:600}
details{border:1px solid var(--line);border-radius:16px;padding:12px 18px;margin-bottom:9px;background:#fff;transition:.25s}details:hover{border-color:var(--sage)}details[open]{box-shadow:var(--sh)}summary{font-weight:620;cursor:pointer}details p{margin:8px 0 0;color:var(--mu);animation:fade .35s}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,120px);background:#0f2d1b;color:#fff;padding:12px 14px 12px 20px;border-radius:16px;font-weight:560;transition:.4s var(--ease);z-index:99;display:flex;gap:16px;align-items:center;box-shadow:0 18px 40px -10px #0f2d1b99}#toast.on{transform:translate(-50%,0)}#toast button{background:none;border:0;color:var(--sage);font-weight:700;padding:4px 8px}
#tray{position:fixed;right:22px;bottom:22px;width:310px;display:grid;gap:8px;z-index:60}.ui{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 18px 40px -14px #0f2d1b55;animation:pop .3s var(--ease)}.ui .un{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ui .bar{margin:8px 0 4px}.ui.ok small{color:var(--green)}.ui.bad small{color:var(--red)}
#dz{position:fixed;inset:0;background:#006838ea;color:#fff;display:grid;place-items:center;z-index:70;font-size:24px;font-weight:700;text-align:center;animation:fade .2s}#dz svg{margin:0 auto 12px;animation:float 2s ease-in-out infinite}
/* auth */
.auth{height:100vh;height:100dvh;display:grid;grid-template-columns:1.05fr 1fr}.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--forest),var(--pine) 58%,var(--moss));color:#fff;padding:48px;display:grid;place-items:center}
.hin{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px;max-width:440px}.hero h2{font-size:34px;line-height:1.15;margin:14px 0 6px;letter-spacing:-.03em}
.bl{position:absolute;border-radius:50%;filter:blur(50px);animation:float 11s ease-in-out infinite}.b1{width:320px;height:320px;background:#39B54A66;top:-80px;right:-60px}.b2{width:380px;height:380px;background:#A8DDB555;bottom:-120px;left:-100px;animation-delay:-4s}.b3{width:180px;height:180px;background:#E6F6EA55;top:40%;right:12%;animation-delay:-7s}
.hp{display:flex;gap:14px;align-items:flex-start;animation:rise .7s var(--ease) both;animation-delay:calc(.25s + var(--i)*.12s)}.hi{background:#ffffff24;border:1px solid #ffffff30;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--cream);backdrop-filter:blur(4px)}.hp b{display:block}.hp div span{opacity:.82;font-size:14px}
.fm{display:grid;place-items:center;padding:24px;background:#fbfdf9}.ac{width:100%;max-width:390px;animation:rise .7s var(--ease) both}.ac.shake{animation:shake .45s}.ac h1{font-size:27px}
.or{display:flex;align-items:center;gap:12px;margin:16px 0 2px;color:var(--mu);font-size:12.5px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.panel.c .card{padding:16px 18px}.panel.c .card.k{padding:12px 18px}.panel.c .card label{margin:9px 0 4px}.panel.c .card h2{margin-bottom:2px}.panel.c .card p{margin-top:0}.panel.c .card .end{margin-top:12px}.panel.c .card[style*="margin-top:16px"]{margin-top:12px!important}.panel.c .card.k[style*="margin-bottom:16px"]{margin-bottom:12px!important}
.panel.c .err{min-height:14px;margin-top:2px}.panel.c .sub{margin-bottom:10px}.panel.c .card input{padding:9px 13px}.av.lg{width:54px;height:54px;font-size:22px}
@media(max-width:860px){body{overflow:auto}.auth{grid-template-columns:1fr}.hero{display:none}.app{grid-template-columns:1fr;height:auto}aside{flex-direction:row;overflow:auto;padding:8px}aside .logo,.sc,.btn.big{display:none}.nav{width:auto;white-space:nowrap}.nav.on::before{display:none}.content{height:auto;padding:0 8px 8px}.panel{padding:20px 16px;overflow:visible}.acts{opacity:1}}

@media(max-height:730px){.panel{padding-top:14px;padding-bottom:10px}.panel.c .card.k{padding:8px 16px}.sub{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== modern motion layer ===== */
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px)}
body::before{width:520px;height:520px;left:-120px;top:-100px;background:#A8DDB566;animation:drift 18s ease-in-out infinite}
body::after{width:480px;height:480px;right:-100px;bottom:-120px;background:#39B54A33;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(80px,60px) scale(1.15)}66%{transform:translate(30px,-50px) scale(.95)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #39B54A00)}50%{filter:drop-shadow(0 6px 16px #39B54A99)}}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
